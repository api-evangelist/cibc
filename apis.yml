name: CIBC
kind: company
description: >-
  Canadian Imperial Bank of Commerce (CIBC) is a Schedule I domestic chartered
  bank and one of Canada's Big Six, formed in 1961 through the merger of the
  Canadian Bank of Commerce and the Imperial Bank of Canada and headquartered in
  Toronto, Ontario. Serving roughly eleven million personal, business,
  commercial, wealth, and capital-markets clients across Personal & Business
  Banking, Wealth Management, and Capital Markets, CIBC is a participant in the
  shared Canadian rails, including Interac e-Transfer and Payments Canada
  settlement systems. Canada has no operational open-banking mandate today: the
  federal Consumer-Driven Banking framework legislated in Budget 2024 and the
  2024 Fall Economic Statement, overseen by the Financial Consumer Agency of
  Canada (FCAC), is not yet live, so access remains voluntary and fragmented.
  CIBC runs no first-party public developer portal (developer.cibc.com does not
  resolve) and publishes no downloadable OpenAPI or Swagger specifications.
  Consumer-permissioned data access is aggregator-mediated: CIBC signed a
  tokenized data-access agreement with U.S. aggregator MX (announced August
  2022, MX's first in Canada) to let clients share financial data with
  third-party apps without exposing banking credentials, and its accounts are
  also reachable through Plaid (Assets, Auth, Balance). Corporate connectivity
  is offered through CIBC SWIFT Corporate Access (SCA) file exchange rather than
  a public REST API, so CIBC's honest public API surface today is
  aggregator-mediated only, pending the coming Consumer-Driven Banking regime.
