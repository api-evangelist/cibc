    type: DeveloperPortal
    note: HTTP 000 - subdomain does not resolve; no first-party developer portal.
  - url: https://www.cibc.com
    type: Website
    note: HTTP 200 - corporate/marketing site; documents banking products, not APIs.
  - url: https://www.cibc.com/en/commercial/business-solutions/managing-cash-flow/cash-management-services.html
    type: Documentation
    note: Cash management services incl. CIBC SWIFT Corporate Access; file-based, no public API.
  - url: https://betakit.com/cibc-latest-big-six-bank-to-partner-with-a-fintech-on-private-open-banking-api/
    type: News
    note: CIBC-MX private open-banking data-access agreement (August 2022); aggregator, not first-party portal.
  - url: https://plaid.com/institutions/cibc/
    type: DataAggregator
    note: CIBC accounts reachable via Plaid (Assets, Auth, Balance).
actions:
  openapiHarvested: false
  reason: |
    No downloadable OpenAPI/Swagger specification is published by CIBC, and no
    first-party public API endpoint is documented, so nothing could be harvested
    verbatim. Identity-only, aggregator-mediated posture recorded honestly.
